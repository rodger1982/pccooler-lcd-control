[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="pccooler-lcd-control"
version="2.0.0a17"
description="Linux support for PCCOOLER CP3 LCD"
requires-python=">=3.11"
dependencies=["pyserial>=3.5","psutil>=5.9","Pillow>=10","PySide6>=6.7"]

[project.scripts]
pccooler-lcd="pccooler_lcd.cli:main"
pccooler-lcd-gui="pccooler_lcd.gui:main"
pccooler-lcd-studio="pccooler_lcd.qt.app:main"
pccooler-lcd-control="pccooler_lcd.qt.app:main"

[tool.setuptools]
package-dir={""="app"}

[tool.setuptools.packages.find]
where=["app"]
include=["pccooler_lcd*"]
