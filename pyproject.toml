[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="pccooler-lcd-control"
version="3.0.0b4"
description="Cross-platform control and layout designer for PCCOOLER CP3 LCD displays"
requires-python=">=3.11"
dependencies=["pyserial>=3.5","psutil>=5.9","Pillow>=10","PySide6>=6.7"]


[project.scripts]
pccooler-lcd-control="pccooler_lcd.unified:main"
pccooler-lcd="pccooler_lcd.cli:main"

[tool.setuptools]
package-dir={""="app"}

[tool.setuptools.packages.find]
where=["app"]
include=["pccooler_lcd*"]
