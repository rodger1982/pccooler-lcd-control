name: Bug report
description: Report a reproducible problem with PCCOOLER-LCD Control
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve PCCOOLER-LCD Control.

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Arch Linux
        - Other Linux distribution
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "Example: 3.0.0-beta2"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: LCD device
      placeholder: "Example: PCCOOLER DC360 CP3 1d6b:0112"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or terminal output
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
