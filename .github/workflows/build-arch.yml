name: Build Arch Linux Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git python python-build python-installer \
            python-wheel python-setuptools python-pyserial python-psutil \
            python-pillow pyside6 ffmpeg sudo

      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE' && makepkg -Csf --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: PCCOOLER-LCD-Control-Arch
          path: "*.pkg.tar.zst"
