name: Cross-platform Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable app and installer
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\windows\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PCCOOLER-LCD-Control-Windows-x64
          if-no-files-found: error
          path: |
            dist/PCCOOLER-LCD-Control-Windows-x64.zip
            dist/installer/PCCOOLER-LCD-Control-Setup.exe

  arch:
    name: Arch Linux x86_64
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git sudo \
            python python-build python-installer python-wheel python-setuptools \
            python-pyserial python-psutil python-pillow pyside6 ffmpeg

      - uses: actions/checkout@v4

      - name: Build package as non-root user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE' && makepkg -Csf --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: PCCOOLER-LCD-Control-Arch-x86_64
          if-no-files-found: error
          path: "*.pkg.tar.zst"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
