name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Inno Setup
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Build application and installer
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\windows\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PCCOOLER-LCD-Control-Windows
          path: |
            dist/PCCOOLER-LCD-Control/**
            dist/installer/PCCOOLER-LCD-Control-Setup.exe
